name: Required CI

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Shell syntax
        run: |
          bash -n scripts/*.sh tests/test_codex_launchd_scripts.sh
      - name: Run smoke tests
        run: |
          bash tests/test_codex_launchd_scripts.sh
      - name: Validate required CI contract
        run: python3 -B tests/test_required_ci_workflow.py
